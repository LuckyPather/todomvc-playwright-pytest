[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-markers",
  "--screenshot=only-on-failure",
  "--tracing=retain-on-failure",
  "--alluredir=allure-results",
  "--clean-alluredir",
]
markers = [
  "smoke: fast representative subset, at least one scenario per functional area",
  "edge: boundary and negative scenarios that go beyond the core requirements",
  "adding: adding new todo items",
  "completing: marking todo items as completed",
  "deleting: deleting todo items",
  "filtering: the Active and Completed filters",
  "covers(*ids): requirement ids from docs/requirements.md the test verifies, linked in Allure",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 99
target-version = ["py312"]
